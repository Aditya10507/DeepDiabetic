services:
  - type: web
    name: deepdiabetic
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,deepdiabetic.onrender.com"
      - key: SHOW_ERROR_DETAILS
        value: "True"
      - key: BUILD_VERSION
        value: "diagnostic-20260518-8d27ee2"
      - key: APP_DB_BACKEND
        value: sqlite
      - key: APP_DATA_DIR
        value: /opt/render/project/src/runtime_data
    disk:
      name: runtime-data
      mountPath: /opt/render/project/src/runtime_data
      sizeGB: 10
