<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepDiabetic Error</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f4fafb;
            color: #12323d;
        }
        main {
            max-width: 560px;
            padding: 32px;
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }
        p {
            margin: 0;
            line-height: 1.5;
        }
        code {
            display: block;
            margin-top: 18px;
            padding: 14px;
            border-radius: 6px;
            background: #e8f3f5;
            color: #173741;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <main>
        <h1>Something went wrong</h1>
        <p>{{ error_message }}</p>
        {% if error_detail %}
            <code>{{ error_detail }}</code>
        {% endif %}
        <p style="margin-top: 18px; font-size: 13px;">Diagnostic build: render-error-details</p>
    </main>
</body>
</html>
